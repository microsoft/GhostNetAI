# training
conf_id: Dev 
algorithm: Plain
num_iters: 3
log_interval: 1
parallel: 0

# data
dataset_root: /home/miao/datasets/wwf_seg/Germany
dataset_name: GhostSeg_DE
num_classes: 2
batch_size: 2
num_workers: 0

# model
model_name: DeepLabV3_ResNet50
weights_init: ImageNet

# optim
## feature
lr_feature: 0.001
momentum_feature: 0.9
weight_decay_feature: 0.0004
## classifier
lr_classifier: 0.01
momentum_classifier: 0.9
weight_decay_classifier: 0.0004
## lr_scheduler
step_size: 10000
gamma: 0.1
